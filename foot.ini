#[bell]
#enabled=0

# -*- conf-ini -*-
# Fully functional foot terminal configuration

[main]
shell=/bin/fish          # Change to /usr/bin/zsh or /usr/bin/fish if preferred
font=monospace:size=10    # Scaled up slightly for modern crispness
pad=12x12                  # Inner window padding for breathing room

[cursor]
style=block
blink=yes                  # Classic animated block cursor
beam-thickness=1.5

[colors-dark]
# Transparency setting: alpha scale is 0.0 (fully clear) to 1.0 (fully solid)
alpha=0.85

# Native background blur toggle (requires foot v1.16+ and matching compositor)
#blur=yes

# Dark/Nord themed color palette for high text contrast over blurred background
foreground=d8dee9
background=1a1c23
regular0=1a1c23 # black
regular1=bf616a # red
regular2=a3be8c # green
regular3=ebcb8b # yellow
regular4=81a1c1 # blue
regular5=b48ead # magenta
regular6=88c0d0 # cyan
regular7=e5e9f0 # white

bright0=4c566a  # bright black
bright1=bf616a  # bright red
bright2=a3be8c  # bright green
bright3=ebcb8b  # bright yellow
bright4=81a1c1  # bright blue
bright5=b48ead  # bright magenta
bright6=8fbcbb  # bright cyan
bright7=eceff4  # bright white

[key-bindings]
# --- Core Operations ---
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

# --- Enhanced Productivity Tools ---
search-start=Control+Shift+r       # Interactive regex scrollback search
show-urls-launch=Control+Shift+o   # Enters keyboard-driven URL mode

# --- Window & Text Sizing ---
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n     # Instantly opens a new terminal window

# --- Viewport Scrolling ---
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-line=Control+Shift+Up
scrollback-down-line=Control+Shift+Down

[search-bindings]
# Bindings specifically active during Ctrl+Shift+R search mode
cancel=Escape Control+g
commit=Return
find-prev=Control+r
find-next=Control+s

[url-bindings]
# Bindings active during keyboard link-clicking mode (Ctrl+Shift+O)
cancel=Escape Control+g
